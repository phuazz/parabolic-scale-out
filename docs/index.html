<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parabolic Scale-Out Monitor</title>
  <style>
    :root {
      color-scheme: light;
      --fg: #1a1a1a;
      --fg-muted: #555;
      --fg-faint: #777;
      --border: #e5e7eb;
      --bg: #ffffff;
      --bg-soft: #f7f7f7;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, sans-serif;
      max-width: 1080px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      color: var(--fg);
      background: var(--bg);
      line-height: 1.55;
    }
    header h1 { font-size: 1.5rem; margin: 0 0 0.25rem; font-weight: 600; }
    header p.sub { margin: 0 0 0.4rem; color: var(--fg-muted); font-size: 0.95rem; }
    header p.meta { margin: 0 0 1.5rem; color: var(--fg-faint); font-size: 0.8rem; }
    header p.meta time { font-variant-numeric: tabular-nums; }

    .placeholder {
      padding: 1rem;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--fg-muted);
    }

    /* Banners (cluster-break and freshness use the same callout shape) */
    .banner {
      margin: 0 0 1rem;
      padding: 0.75rem 1rem;
      border-radius: 4px;
      font-size: 0.92rem;
    }
    .banner strong { font-weight: 600; }
    .banner ul { margin: 0.35rem 0 0; padding-left: 1.2rem; }
    .banner li { margin: 0.1rem 0; }
    .banner.cluster { background: #fef9c3; border: 1px solid #eab308; color: #713f12; }
    .banner.freshness { background: #ffedd5; border: 1px solid #fb923c; color: #7c2d12; }

    /* Signals table */
    table.signals {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }
    table.signals th,
    table.signals td {
      padding: 0.6rem 0.55rem;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--border);
    }
    table.signals th {
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--fg-faint);
      border-bottom: 2px solid var(--border);
    }
    table.signals td.ticker { font-weight: 600; font-variant-numeric: tabular-nums; }
    table.signals td.num,
    table.signals th.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    table.signals .submeta {
      display: block;
      font-size: 0.78rem;
      color: var(--fg-faint);
      margin-top: 0.15rem;
    }
    table.signals tr.notes-row td {
      border-bottom: 1px solid var(--border);
      padding-top: 0;
      padding-bottom: 0.55rem;
      font-size: 0.78rem;
      color: var(--fg-faint);
      font-style: italic;
    }
    table.signals tr.notes-row td ul { margin: 0; padding-left: 1.1rem; }

    /* State pills */
    .pill {
      display: inline-block;
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .pill.state-holding         { background: #f1f5f9; color: #475569; border-color: #cbd5e1; }
    .pill.state-tranche1        { background: #fef9c3; color: #854d0e; border-color: #facc15; }
    .pill.state-tranche2        { background: #ffedd5; color: #9a3412; border-color: #fb923c; }
    .pill.state-tranche2-broken { background: #fecaca; color: #7f1d1d; border-color: #dc2626; }
    .pill.state-tranche3        { background: #fee2e2; color: #991b1b; border-color: #f87171; }
    .pill.cluster-quiet         { background: var(--bg-soft); color: var(--fg-faint); border-color: var(--border); }

    /* Extension chart */
    .ext-chart {
      margin: 0 0 1.5rem;
      padding: 0.5rem 0 0;
    }
    .ext-svg {
      width: 100%;
      height: auto;
      display: block;
      font-family: inherit;
    }
    .ext-title    { font-size: 13px; font-weight: 600; fill: var(--fg); }
    .ext-subtitle { font-size: 11px; font-weight: 400; fill: var(--fg-muted); }
    .ext-label    { font-size: 12px; font-weight: 600; fill: var(--fg); font-variant-numeric: tabular-nums; }
    .ext-value    { font-size: 11px; font-weight: 400; fill: var(--fg-muted); font-variant-numeric: tabular-nums; }
    .ext-unavail  { font-size: 11px; font-style: italic; fill: var(--fg-faint); }
    .ext-axis     { stroke: var(--border); stroke-width: 1; }
    .ext-peak-line  { stroke: #6b7280; stroke-width: 1; stroke-dasharray: 4 3; }
    .ext-peak-label { font-size: 11px; font-weight: 600; fill: #475569; }
    .ext-divider    { stroke: var(--border); stroke-width: 1; stroke-dasharray: 2 2; }
    .ext-bar-above  { fill: #dc2626; }
    .ext-bar-below  { fill: #f59e0b; }
    .ext-bar-ref    { fill: #94a3b8; }

    /* Assumptions block */
    details.assumptions {
      margin-top: 1.75rem;
      font-size: 0.85rem;
      color: var(--fg-muted);
    }
    details.assumptions summary {
      cursor: pointer;
      color: var(--fg-muted);
      font-weight: 600;
    }
    details.assumptions ul { margin: 0.4rem 0 0 0; padding-left: 1.2rem; }
    details.assumptions li { margin: 0.15rem 0; }
    details.assumptions code { font-size: 0.85em; background: var(--bg-soft); padding: 0 0.25rem; border-radius: 3px; }

    footer {
      margin-top: 2.25rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--fg-faint);
    }
    footer p { margin: 0.25rem 0; }
  </style>
</head>
<body>
  <header>
    <h1>Parabolic Scale-Out Monitor</h1>
    <p class="sub">Systematic tranche-state signals for selected names in extended trends.</p>
    <p class="meta">Generated: <time id="generated">&mdash;</time></p>
  </header>

  <section id="freshness-banner" class="banner freshness" hidden>
    <strong>Data freshness check:</strong>
    <ul id="freshness-detail"></ul>
  </section>

  <section id="cluster-banner" class="banner cluster" hidden>
    <strong>Semiconductor cluster break:</strong> <span id="cluster-detail"></span>
  </section>

  <section id="ext-chart" class="ext-chart" hidden></section>

  <main id="signals">
    <div class="placeholder">Loading signals&hellip;</div>
  </main>

  <details class="assumptions" id="assumptions-block" hidden>
    <summary>Assumptions and definitions</summary>
    <ul id="assumptions-list"></ul>
  </details>

  <footer>
    <p>Illustrative systematic signals &mdash; not investment advice.</p>
  </footer>

  <script>
    // PRELOADED_DATA placeholder. scripts/build.py replaces the line below at build time
    // with the contents of data/signals.json. For local dev under `npx serve .`,
    // this stays null and we fall back to fetch().
    const PRELOADED_DATA = {"generatedAt":"2026-08-10T22:07:48+00:00","source":"https://phuazz.github.io/Portfolio-Command-Centre/data/history.json","assumptions":{"tranche1":{"extensionPct":0.05,"highLookback":20,"highProximityPct":0.03},"confirmedClose":"Latest bar in upstream history.json. Weekend-stamped bars are used as-is and flagged in notes; never use intraday values.","priceBasis":"Close (c), not adjusted close (ac)."},"freshness":{"asOfBuild":"2026-08-10T22:07:48+00:00","staleThresholdDays":5,"maxBarAgeDays":0.92,"staleTickers":[],"weekendStampedTickers":[]},"cluster":{"semiconductor":{"members":["4004.T","INTC","MRVL","MU","SOI.PA"],"brokenMembers":["INTC","MRVL","MU"],"brokenCount":3,"clusterBreak":true,"rule":"Two or more cluster members in Tranche 2 or beyond."}},"silverJanPeakPct":80,"reference":{"SLV":{"ticker":"SLV","lastBarDate":"2026-08-10","lastClose":59.41,"ema200":59.0811,"extPctEma200":0.56}},"tickers":[{"ticker":"MU","lastBarDate":"2026-08-10","lastBarUnix":1786368600,"lastBarWeekday":"Monday","barAgeDays":0.36,"isWeekendStamped":false,"isStale":false,"lastClose":861.0,"ema8":870.2692,"ema21":893.7586,"ema50":888.3942,"ema200":609.8892,"extPctEma200":41.17,"drawdownFromRecentHigh":13.05,"parabolaBroken":false,"macd":{"line":-25.100237,"signal":-27.107003,"hist":2.006766},"recentHigh":990.21,"recentHighLookback":20,"state":"tranche3","stateLabel":"Below EMA 21 - Tranche 3 trail active","activeTrigger":{"level":"ema21","value":893.7586},"distanceToTrigger":-0.036653,"cluster":"semiconductor","barCount":2512,"notes":["Price series may be split-adjusted - verify absolute levels independently."],"clusterBreak":true,"clusterBrokenCount":3,"clusterBrokenMembers":["MU","INTC","MRVL"]},{"ticker":"INTC","lastBarDate":"2026-08-10","lastBarUnix":1786368600,"lastBarWeekday":"Monday","barAgeDays":0.36,"isWeekendStamped":false,"isStale":false,"lastClose":97.52,"ema8":97.5128,"ema21":99.6478,"ema50":102.7943,"ema200":76.6657,"extPctEma200":27.2,"drawdownFromRecentHigh":9.5,"parabolaBroken":false,"macd":{"line":-3.539827,"signal":-5.063783,"hist":1.523957},"recentHigh":107.76,"recentHighLookback":20,"state":"tranche3","stateLabel":"Below EMA 21 - Tranche 3 trail active","activeTrigger":{"level":"ema21","value":99.6478},"distanceToTrigger":-0.021353,"cluster":"semiconductor","barCount":2512,"notes":[],"clusterBreak":true,"clusterBrokenCount":3,"clusterBrokenMembers":["MU","INTC","MRVL"]},{"ticker":"SOI.PA","lastBarDate":"2026-08-10","lastBarUnix":1786345200,"lastBarWeekday":"Monday","barAgeDays":0.63,"isWeekendStamped":false,"isStale":false,"lastClose":120.3,"ema8":116.0063,"ema21":111.0365,"ema50":112.8248,"ema200":88.0435,"extPctEma200":36.64,"drawdownFromRecentHigh":1.8,"parabolaBroken":false,"macd":{"line":2.088894,"signal":-1.176009,"hist":3.264903},"recentHigh":122.5,"recentHighLookback":20,"state":"holding","stateLabel":"Above EMA 8 - holding","activeTrigger":{"level":"ema8","value":116.0063},"distanceToTrigger":0.037013,"cluster":"semiconductor","barCount":2560,"notes":[],"clusterBreak":true,"clusterBrokenCount":3,"clusterBrokenMembers":["MU","INTC","MRVL"]},{"ticker":"4004.T","lastBarDate":"2026-08-10","lastBarUnix":1786320000,"lastBarWeekday":"Monday","barAgeDays":0.92,"isWeekendStamped":false,"isStale":false,"lastClose":16335.0,"ema8":15267.0512,"ema21":15105.2596,"ema50":15505.5014,"ema200":12231.7347,"extPctEma200":33.55,"drawdownFromRecentHigh":0.37,"parabolaBroken":false,"macd":{"line":-187.652427,"signal":-586.53155,"hist":398.879123},"recentHigh":16395.0,"recentHighLookback":20,"state":"tranche1","stateLabel":"Above EMA 8 - Tranche 1 trigger met (extended near highs)","activeTrigger":{"level":"ema8","value":15267.0512},"distanceToTrigger":0.069951,"cluster":"semiconductor","barCount":2463,"notes":[],"clusterBreak":true,"clusterBrokenCount":3,"clusterBrokenMembers":["MU","INTC","MRVL"]},{"ticker":"NOK","lastBarDate":"2026-08-10","lastBarUnix":1786368600,"lastBarWeekday":"Monday","barAgeDays":0.36,"isWeekendStamped":false,"isStale":false,"lastClose":9.13,"ema8":9.3813,"ema21":10.0303,"ema50":11.1349,"ema200":9.7121,"extPctEma200":-5.99,"drawdownFromRecentHigh":21.97,"parabolaBroken":false,"macd":{"line":-0.792499,"signal":-0.911374,"hist":0.118875},"recentHigh":11.7,"recentHighLookback":20,"state":"tranche3","stateLabel":"Below EMA 21 - Tranche 3 trail active","activeTrigger":{"level":"ema21","value":10.0303},"distanceToTrigger":-0.089761,"cluster":null,"barCount":2512,"notes":[]},{"ticker":"MRVL","lastBarDate":"2026-08-10","lastBarUnix":1786368600,"lastBarWeekday":"Monday","barAgeDays":0.36,"isWeekendStamped":false,"isStale":false,"lastClose":208.56,"ema8":206.085,"ema21":208.6935,"ema50":213.6969,"ema200":158.5856,"extPctEma200":31.51,"drawdownFromRecentHigh":6.24,"parabolaBroken":false,"macd":{"line":-6.591856,"signal":-11.128721,"hist":4.536865},"recentHigh":222.44,"recentHighLookback":20,"state":"tranche3","stateLabel":"Below EMA 21 - Tranche 3 trail active","activeTrigger":{"level":"ema21","value":208.6935},"distanceToTrigger":-0.00064,"cluster":"semiconductor","barCount":2512,"notes":[],"clusterBreak":true,"clusterBrokenCount":3,"clusterBrokenMembers":["MU","INTC","MRVL"]},{"ticker":"LIFE","lastBarDate":"2026-08-10","lastBarUnix":1786368600,"lastBarWeekday":"Monday","barAgeDays":0.36,"isWeekendStamped":false,"isStale":false,"lastClose":32.43,"ema8":27.6118,"ema21":23.5045,"ema50":20.7843,"ema200":null,"extPctEma200":null,"drawdownFromRecentHigh":0.0,"parabolaBroken":false,"macd":{"line":3.057394,"signal":1.678019,"hist":1.379375},"recentHigh":32.43,"recentHighLookback":20,"state":"tranche1","stateLabel":"Above EMA 8 - Tranche 1 trigger met (extended near highs)","activeTrigger":{"level":"ema8","value":27.6118},"distanceToTrigger":0.1745,"cluster":null,"barCount":133,"notes":["Limited history (133 bars) - EMA 200 unavailable."]}]};

    const STATE_LABEL = {
      holding:  "Holding",
      tranche1: "Tranche 1",
      tranche2: "Tranche 2",
      tranche3: "Tranche 3",
    };

    async function loadSignals() {
      if (PRELOADED_DATA) return PRELOADED_DATA;
      try {
        const r = await fetch("data/signals.json", { cache: "no-store" });
        if (!r.ok) throw new Error("fetch failed: " + r.status);
        return await r.json();
      } catch (e) {
        return { error: e.message, generatedAt: null, tickers: [] };
      }
    }

    function fmtNum(v, decimals) {
      if (v === null || v === undefined) return "—";
      if (decimals === undefined) decimals = 2;
      return Number(v).toLocaleString(undefined, {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals,
      });
    }

    function chooseDecimals(v) {
      // Light heuristic: large absolute values (e.g. 4004.T at 17,200 JPY) read better with no decimals.
      const a = Math.abs(v);
      if (a >= 1000) return 0;
      if (a >= 100) return 2;
      return 2;
    }

    function pctSigned(x) {
      const sign = x >= 0 ? "+" : "−"; // unicode minus
      return sign + (Math.abs(x) * 100).toFixed(2) + "%";
    }

    function triggerLabel(level) {
      return { ema8: "EMA 8", ema21: "EMA 21", ema50: "EMA 50", ema200: "EMA 200" }[level] || level;
    }

    function distanceDescription(state, distance) {
      // Short qualifier - adds information about direction without restating
      // the numeric distance shown in the parent cell.
      if (state === "holding" || state === "tranche1") {
        return distance >= 0 ? "cushion to EMA 8 break" : "EMA 8 breached";
      }
      if (state === "tranche2") {
        return distance >= 0 ? "cushion to EMA 21 break" : "EMA 21 breached";
      }
      return "to EMA 21 reclaim";
    }

    function renderClusterBanner(payload) {
      const sect = document.getElementById("cluster-banner");
      const detail = document.getElementById("cluster-detail");
      const semi = payload.cluster && payload.cluster.semiconductor;
      if (!semi || !semi.clusterBreak) {
        sect.hidden = true;
        return;
      }
      sect.hidden = false;
      // Prefer brokenMembers if present (introduced after the initial release);
      // fall back to brokenCount-only phrasing if an older build is in play.
      const broken = (semi.brokenMembers && semi.brokenMembers.length)
        ? semi.brokenMembers
        : null;
      detail.textContent =
        semi.brokenCount + " of " + semi.members.length +
        " semiconductor-cluster names in Tranche 2 or beyond" +
        (broken ? " (" + broken.join(", ") + ")" : "") + ".";
    }

    function renderFreshness(payload) {
      const sect = document.getElementById("freshness-banner");
      const list = document.getElementById("freshness-detail");
      const items = [];
      const f = payload.freshness;

      // Build-age check at page load (catches the case where the cron has not
      // run for a while and the inlined data is older than the build cycle).
      if (payload.generatedAt) {
        const built = new Date(payload.generatedAt);
        const ageHours = (Date.now() - built.getTime()) / 3600000;
        if (!isNaN(ageHours) && ageHours > 36) {
          const days = ageHours / 24;
          items.push(
            "This build is " + (days >= 2 ? days.toFixed(1) + " days" : ageHours.toFixed(1) + " hours") +
            " old. The daily refresh may have failed."
          );
        }
      }

      if (f && f.staleTickers && f.staleTickers.length) {
        items.push(
          "Stale upstream bars (older than " + f.staleThresholdDays + " days): " +
          f.staleTickers.join(", ") + "."
        );
      }
      if (f && f.weekendStampedTickers && f.weekendStampedTickers.length) {
        items.push(
          "Latest bar stamped on a weekend (likely upstream artefact): " +
          f.weekendStampedTickers.join(", ") + "."
        );
      }

      if (items.length === 0) {
        sect.hidden = true;
        list.innerHTML = "";
        return;
      }
      sect.hidden = false;
      list.innerHTML = items.map(function (t) { return "<li>" + t + "</li>"; }).join("");
    }

    function renderAssumptions(payload) {
      const block = document.getElementById("assumptions-block");
      const list = document.getElementById("assumptions-list");
      const a = payload.assumptions;
      if (!a) { block.hidden = true; return; }
      const items = [];
      items.push("Tranche 1 trigger: close at least " + (a.tranche1.extensionPct * 100).toFixed(0) +
                 "% above EMA 8 AND within " + (a.tranche1.highProximityPct * 100).toFixed(0) +
                 "% of the trailing " + a.tranche1.highLookback + "-day close-high.");
      items.push("Tranche 2 trigger: confirmed daily close below EMA 8.");
      items.push("Tranche 3 trigger: confirmed daily close below EMA 21 (trail active).");
      items.push("Confirmed close: " + a.confirmedClose);
      items.push("Price basis: " + a.priceBasis);
      if (payload.cluster && payload.cluster.semiconductor) {
        items.push("Cluster rule: " + payload.cluster.semiconductor.rule +
                   " Members: " + payload.cluster.semiconductor.members.join(", ") + ".");
      }
      if (payload.freshness && payload.freshness.staleThresholdDays) {
        items.push("Freshness threshold: a ticker is flagged stale when its latest bar is more than " +
                   payload.freshness.staleThresholdDays + " days old. The build banner also fires if the " +
                   "page itself was built more than 36 hours ago.");
      }
      list.innerHTML = items.map(function (t) { return "<li>" + t + "</li>"; }).join("");
      block.hidden = false;
    }

    function renderTable(payload) {
      const root = document.getElementById("signals");
      if (payload.error) {
        root.innerHTML = '<div class="placeholder">No signals available yet (' + payload.error + ').</div>';
        return;
      }
      const rows = payload.tickers || [];
      if (rows.length === 0) {
        root.innerHTML = '<div class="placeholder">No signals available yet.</div>';
        return;
      }

      const html = ['<table class="signals"><thead><tr>',
        '<th>Ticker</th>',
        '<th>State</th>',
        '<th class="num">Last close</th>',
        '<th class="num">EMA 8 / EMA 21</th>',
        '<th>Active trigger</th>',
        '<th class="num">Distance</th>',
        '<th>Cluster</th>',
        '</tr></thead><tbody>'];

      for (const r of rows) {
        if (r.error) {
          html.push('<tr><td class="ticker">' + r.ticker + '</td>' +
                    '<td colspan="6"><em>' + r.error + '</em></td></tr>');
          continue;
        }
        const dp = chooseDecimals(r.lastClose);
        // Parabola-broken names get a distinct pill so they do not read as a
        // routine Tranche 2; the state code itself is unchanged.
        const isBroken = r.parabolaBroken && r.state === "tranche2";
        const stateClass = isBroken ? "state-tranche2-broken" : "state-" + r.state;
        const stateSub = isBroken
          ? "Parabola broken &mdash; beyond routine Tranche 2"
          : r.stateLabel;
        const trigLevel = triggerLabel(r.activeTrigger.level);
        const trigValue = fmtNum(r.activeTrigger.value, dp);
        const distDesc = distanceDescription(r.state, r.distanceToTrigger);

        // Cluster column: static membership tag only. Break status lives in
        // the banner; repeating it on every chip duplicates information.
        const clusterCell = (r.cluster === "semiconductor")
          ? '<span class="pill cluster-quiet">Semi</span>'
          : '<span style="color:var(--fg-faint)">&mdash;</span>';

        html.push('<tr>',
          '<td class="ticker">' + r.ticker + '</td>',
          '<td><span class="pill ' + stateClass + '">' + STATE_LABEL[r.state] + '</span>' +
            '<span class="submeta">' + stateSub + '</span></td>',
          '<td class="num">' + fmtNum(r.lastClose, dp) +
            '<span class="submeta">' + r.lastBarDate + '</span></td>',
          '<td class="num">' + fmtNum(r.ema8, dp) +
            '<span class="submeta">' + fmtNum(r.ema21, dp) + '</span></td>',
          '<td>' + trigLevel +
            '<span class="submeta">@ ' + trigValue + '</span></td>',
          '<td class="num">' + pctSigned(r.distanceToTrigger) +
            '<span class="submeta">' + distDesc + '</span></td>',
          '<td>' + clusterCell + '</td>',
          '</tr>');

        if (r.notes && r.notes.length) {
          html.push('<tr class="notes-row"><td></td><td colspan="6"><ul>');
          for (const n of r.notes) html.push('<li>' + n + '</li>');
          html.push('</ul></td></tr>');
        }
      }

      html.push('</tbody></table>');
      root.innerHTML = html.join("");
    }

    function renderGenerated(payload) {
      const el = document.getElementById("generated");
      if (!payload.generatedAt) { el.textContent = "—"; return; }
      try {
        const d = new Date(payload.generatedAt);
        el.dateTime = payload.generatedAt;
        el.textContent = d.toISOString().replace("T", " ").replace(/\.\d+Z$/, " UTC").replace("Z", " UTC");
      } catch (e) {
        el.textContent = payload.generatedAt;
      }
    }

    function renderChart(payload) {
      const root = document.getElementById("ext-chart");
      const rows = (payload.tickers || []).map(function (r) {
        return {
          ticker: r.ticker,
          ext: (typeof r.extPctEma200 === "number") ? r.extPctEma200 : null,
          isRef: false,
        };
      });
      // Sort: numeric extension descending, nulls last (ticker alpha for stability).
      rows.sort(function (a, b) {
        if (a.ext === null && b.ext === null) return a.ticker.localeCompare(b.ticker);
        if (a.ext === null) return 1;
        if (b.ext === null) return -1;
        return b.ext - a.ext;
      });
      // Append SLV reference row at the bottom, visually separated.
      const slv = payload.reference && payload.reference.SLV;
      if (slv && typeof slv.extPctEma200 === "number") {
        rows.push({ ticker: "SLV", ext: slv.extPctEma200, isRef: true });
      }
      if (rows.length === 0) { root.hidden = true; return; }

      const peakPct = (typeof payload.silverJanPeakPct === "number")
        ? payload.silverJanPeakPct : 80;

      // X-axis: 0 to max-data padded, rounded up to next multiple of 20.
      const numericExts = rows
        .filter(function (r) { return r.ext !== null; })
        .map(function (r) { return r.ext; });
      const dataMax = Math.max.apply(null, numericExts.concat([peakPct]));
      const xMax = Math.max(20, Math.ceil((dataMax * 1.08) / 20) * 20);

      // Layout
      const W = 800;
      const margin = { left: 72, right: 72, top: 60, bottom: 24 };
      const rowH = 30;
      const plotW = W - margin.left - margin.right;
      const refIdx = rows.findIndex(function (r) { return r.isRef; });
      const plotH = rows.length * rowH + (refIdx >= 0 ? 8 : 0);
      const H = margin.top + plotH + margin.bottom;
      const xScale = function (v) { return margin.left + (v / xMax) * plotW; };

      const out = [];
      out.push('<svg viewBox="0 0 ' + W + ' ' + H + '" class="ext-svg" preserveAspectRatio="xMinYMin meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Extension above 200-day moving average versus silver January peak">');

      out.push('<text x="' + margin.left + '" y="22" class="ext-title">How stretched is each name versus silver in January</text>');
      out.push('<text x="' + margin.left + '" y="40" class="ext-subtitle">Price distance above the 200-day moving average</text>');

      // Plot baseline (x=0)
      out.push('<line x1="' + margin.left + '" y1="' + margin.top + '" x2="' + margin.left + '" y2="' + (margin.top + plotH) + '" class="ext-axis"/>');

      // Peak reference line at +80%
      const peakX = xScale(peakPct);
      out.push('<line x1="' + peakX.toFixed(1) + '" y1="' + (margin.top - 6) + '" x2="' + peakX.toFixed(1) + '" y2="' + (margin.top + plotH) + '" class="ext-peak-line"/>');
      out.push('<text x="' + peakX.toFixed(1) + '" y="' + (margin.top - 10) + '" class="ext-peak-label" text-anchor="middle">Silver Jan peak &asymp; +' + peakPct + '%</text>');

      let yCursor = margin.top;
      rows.forEach(function (r, i) {
        // Divider above the reference row.
        if (r.isRef) {
          out.push('<line x1="' + margin.left + '" y1="' + (yCursor + 2).toFixed(1) + '" x2="' + (W - margin.right) + '" y2="' + (yCursor + 2).toFixed(1) + '" class="ext-divider"/>');
          yCursor += 8;
        }
        const cy = yCursor + rowH / 2;
        const labelY = cy + 4;
        out.push('<text x="' + (margin.left - 8) + '" y="' + labelY.toFixed(1) + '" class="ext-label" text-anchor="end">' + r.ticker + '</text>');

        if (r.ext === null) {
          out.push('<text x="' + (margin.left + 6) + '" y="' + labelY.toFixed(1) + '" class="ext-unavail">EMA 200 unavailable</text>');
        } else {
          const xEnd = xScale(r.ext);
          const barW = Math.max(1, xEnd - margin.left);
          const barH = 16;
          const barY = cy - barH / 2;
          let cls = "ext-bar-below";
          if (r.isRef) cls = "ext-bar-ref";
          else if (r.ext >= peakPct) cls = "ext-bar-above";
          out.push('<rect x="' + margin.left + '" y="' + barY.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + barH + '" class="' + cls + '"/>');
          const valStr = (r.ext >= 0 ? "+" : "−") + Math.abs(r.ext).toFixed(1) + "%";
          out.push('<text x="' + (xEnd + 6).toFixed(1) + '" y="' + labelY.toFixed(1) + '" class="ext-value">' + valStr + (r.isRef ? " (reference)" : "") + '</text>');
        }

        yCursor += rowH;
      });

      out.push('</svg>');
      root.innerHTML = out.join("");
      root.hidden = false;
    }

    function render(payload) {
      renderGenerated(payload);
      renderFreshness(payload);
      renderClusterBanner(payload);
      renderChart(payload);
      renderAssumptions(payload);
      renderTable(payload);
    }

    loadSignals().then(render);
  </script>
</body>
</html>
